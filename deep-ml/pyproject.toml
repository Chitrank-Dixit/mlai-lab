# File: deep-ml/pyproject.toml
[project]
name = "deep-ml"
version = "0.1.0"
description = "Deep ML Lab environment"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tensorflow>=2.15.0",
    "keras>=3.0.0",
    "lightning>=2.1.0",
    "transformers>=4.35.0",
    "mlflow>=2.5.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "jupyterlab>=4.0.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
