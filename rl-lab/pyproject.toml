# File: rl-lab/pyproject.toml
[project]
name = "rl-lab"
version = "0.1.0"
description = "RL Lab environment"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.1.0",
    "ray[rllib]>=2.7.0",
    "mujoco>=3.0.0",
    "mlflow>=2.5.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyvirtualdisplay",
    "jupyterlab>=4.0.0",
    "torch>=2.2.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
