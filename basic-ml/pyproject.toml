# File: basic-ml/pyproject.toml
[project]
name = "basic-ml"
version = "0.1.0"
description = "Basic ML Lab environment"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "shap>=0.42.0",
    "numba>=0.57.0",
    "llvmlite>=0.40.0",
    "mlflow>=2.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "ipywidgets>=8.0.0",
    "jupyterlab>=4.0.0",
    "statsmodels>=0.14.6",
]
