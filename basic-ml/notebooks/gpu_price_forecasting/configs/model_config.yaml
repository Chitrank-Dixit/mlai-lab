# Model Configuration for GPU Price Forecasting

feature_engineering:
  lag_days: [1, 3, 7, 14]
  rolling_windows: [3, 7, 14]
  reference_sku_id: "RTX5070-12G-ASUS-TUF"

baseline_models:
  moving_median_window: 7
  ewma_span: 7

ml_model:
  type: "ridge"
  alpha: 1.0
  forecast_horizon_days: 7
  train_test_split_ratio: 0.8

buy_wait_strategy:
  target_discount_percent: 0.05
  volatility_high_threshold: 0.03
  decision_rules:
    strong_buy_threshold: 0.90
    buy_threshold: 0.70
    wait_threshold: 0.40
