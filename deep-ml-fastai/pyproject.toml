[project]
name = "deep-ml-fastai"
version = "0.1.0"
description = "fast.ai deep learning lab environment"
requires-python = ">=3.11"
dependencies = [
    "fastai>=2.7.19",
    "fastcore>=1.7.0",
    "fastdownload>=0.0.7",
    "fasttransform>=0.0.2",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "timm>=1.0.0",
    "ipywidgets>=8.0.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "mlflow>=2.5.0",
    "duckduckgo_search>=6.0.0",
    "pillow>=10.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
