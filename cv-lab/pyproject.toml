# File: cv-lab/pyproject.toml
[project]
name = "cv-lab"
version = "0.1.0"
description = "CV Lab environment"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "ultralytics>=8.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "segment-anything>=1.0",
    "mlflow>=2.5.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "jupyterlab>=4.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
